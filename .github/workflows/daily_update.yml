name: Daily PLAVE Update

on:
  schedule:
    # 기존 수집/재시도 시간대를 유지한다.
    # 매 실행 종료 시 대상 날짜의 정상 원격 아카이브와 게시 여부를 검증한다.
    - cron: '32 15 * * *'   # 00:32 KST (UTC+9)
    - cron: '10 17 * * *'   # 02:10 KST (재시도)
    - cron: '12 18 * * *'   # 03:12 KST (재시도)
    - cron: '24 20 * * *'   # 05:24 KST (재시도)
    - cron: '15 22 * * *'   # 07:15 KST (재시도)
    - cron: '12 0 * * *'    # 09:12 KST (재시도)
    - cron: '1 2 * * *'     # 11:01 KST (재시도)
  workflow_dispatch:         # 수동 실행 허용

# 같은 날 재시도들이 겹쳐 동시에 push 하는 일을 막는다(앞 실행이 끝난 뒤 진행).
concurrency:
  group: daily-plave-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fix target date for this run
        id: target
        run: |
          echo "date=$(python -c 'from datetime import datetime, timedelta, timezone; print((datetime.now(timezone(timedelta(hours=9))) - timedelta(days=1)).strftime("%Y-%m-%d"))')" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        id: dependencies
        continue-on-error: true
        run: pip install -r requirements.txt

      - name: Run daily update
        id: collect
        if: steps.dependencies.outcome == 'success'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python run.py --date "${{ steps.target.outputs.date }}"
        timeout-minutes: 10

      - name: Validate publish candidate
        id: candidate
        if: always()
        continue-on-error: true
        run: python archive_health.py candidate --date "${{ steps.target.outputs.date }}"

      - name: Commit and push valid results
        id: publish
        if: steps.candidate.outcome == 'success'
        continue-on-error: true
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- index.html archive/dates.js "archive/$TARGET_DATE.html" "archive/data/$TARGET_DATE.json"
          if git diff --staged --quiet; then
            echo "변경 없음 — 기존 아카이브 유지"
          else
            git commit -m "Daily update: $TARGET_DATE"
            git push || (git pull --rebase origin main && python archive_health.py candidate --date "$TARGET_DATE" && git push)
          fi

      # 최종 판정만 critical failure를 결정한다. Gmail은 발송하지 않는다.
      # 확인 불가/손상/미게시 상태를 성공으로 바꾸지 않는다.
      - name: Verify target remote archive and publication
        if: always()
        timeout-minutes: 5
        run: >-
          python archive_health.py remote
          --date "${{ steps.target.outputs.date }}"
          --outcome "${{ steps.dependencies.outcome }}"
          --outcome "${{ steps.collect.outcome }}"
          --outcome "${{ steps.candidate.outcome }}"
          --outcome "${{ steps.publish.outcome }}"
